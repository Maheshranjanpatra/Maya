<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Maya - Your caring offline habit & task companion" />
  <title>Maya</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maya: {
              bg: '#020617',
              card: '#0f172a',
              border: '#1e293b',
              neon: '#10b981',
              neon2: '#22d3ee',
              flame: '#f97316',
              pink: '#f472b6'
            }
          },
          fontFamily: {
            nunito: ['Nunito', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-maya-bg text-white font-nunito overflow-hidden h-screen select-none">
  
  <div id="app" class="relative h-full flex flex-col max-w-lg mx-auto">
    
    <!-- Sticky Header -->
    <header class="sticky top-0 z-40 px-4 py-3 flex items-center justify-between safe-top header-glass">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="menu-trigger" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="15" y2="18"></line>
          </svg>
        </button>
        <div class="flex items-center gap-2">
          <img src="logo.png" alt="Maya" class="w-9 h-9 rounded-2xl logo-glow" />
          <span class="font-outfit font-bold text-xl tracking-wide">Maya</span>
        </div>
      </div>
      <button id="enableNotifBtn" class="notif-btn">
        Enable Alerts
      </button>
    </header>

    <!-- Main Content -->
    <main id="mainContent" class="flex-1 overflow-y-auto px-4 pt-3 scroll-smooth main-content">
      <!-- Dynamic content -->
    </main>

    <!-- ========== FLOATING GLASS BOTTOM NAV ========== -->
    <div class="nav-wrapper">
      <nav class="bottom-nav" id="bottomNav">
        <!-- Moving circular cutout + indicator -->
        <div class="nav-cutout" id="navCutout">
          <div class="nav-indicator"></div>
        </div>

        <button class="nav-item active" data-tab="habits">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="nav-label">Habits</span>
        </button>

        <button class="nav-item" data-tab="todos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          <span class="nav-label">To-Dos</span>
        </button>

        <button class="nav-item" data-tab="visuals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <span class="nav-label">Visuals</span>
        </button>

        <button class="nav-item" data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          <span class="nav-label">Settings</span>
        </button>
      </nav>
    </div>

    <!-- ========== SIDE MENU ========== -->
    <div id="sideMenuOverlay" class="side-menu-overlay"></div>
    
    <aside id="sideMenu" class="side-menu">
      <div class="side-profile stagger-item item-1">
        <div id="sideAvatar" class="profile-avatar">
          <!-- anime girl injected -->
        </div>
        <h2 id="profileName" class="profile-name">My Love</h2>
        <p class="profile-meta">Level <span id="sideLevel">1</span> • <span id="sideXP">0</span> XP</p>
      </div>

      <div class="menu-divider stagger-item item-2"></div>

      <div class="side-links stagger-item item-3">
        <button class="side-link" data-side="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </button>
        <button class="side-link" data-side="level">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Level & Badges</span>
        </button>
        <button class="side-link" data-side="sounds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15.536a5 5 0 001.414 1.414m2.828-9.9a9 9 0 0112.728 0"/></svg>
          <span>Sound Settings</span>
        </button>
        <button class="side-link" data-side="export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>Backup & Restore</span>
        </button>
      </div>

      <div class="side-footer stagger-item item-4">
        Made with care for you
      </div>
    </aside>

    <!-- Quote Popup -->
    <div id="quotePopup" class="fixed inset-0 z-[60] hidden items-center justify-center p-6 bg-black/70 backdrop-blur-sm">
      <div class="relative bg-maya-card border border-maya-neon/30 rounded-3xl p-6 max-w-sm w-full shadow-neon-strong animate-pop">
        <button id="closeQuote" class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center rounded-full bg-maya-bg text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <div class="flex justify-center mb-4" id="quoteAvatar"></div>
        <p id="quoteText" class="text-center text-lg font-medium leading-relaxed text-slate-100"></p>
        <p class="text-center text-xs text-maya-neon mt-4 font-semibold">— Maya</p>
      </div>
    </div>

    <!-- Level Up / Special Modal -->
    <div id="specialModal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4 bg-black/80">
      <div class="bg-maya-card border border-maya-flame/50 rounded-3xl p-8 max-w-sm w-full text-center shadow-flame animate-pop">
        <div id="specialContent"></div>
        <button id="closeSpecial" class="mt-6 px-8 py-3 rounded-2xl bg-gradient-to-r from-maya-neon to-maya-neon2 font-bold text-maya-bg active:scale-95 transition">Okay, love</button>
      </div>
    </div>

    <!-- Generic Modal -->
    <div id="modal" class="fixed inset-0 z-[55] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
      <div id="modalContent" class="bg-maya-card border border-maya-border rounded-3xl p-6 max-w-sm w-full shadow-xl animate-pop max-h-[85vh] overflow-y-auto"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[80] px-5 py-3 rounded-2xl bg-maya-card border border-maya-neon/40 text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 max-w-[90%]"></div>

    <!-- Confetti -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-[90]"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
