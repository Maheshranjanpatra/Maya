<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="Maya turns your syllabus into a realistic study plan.">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/icons/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="shortcut icon" href="/static/icons/favicon.ico">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <title>Maya — stop deciding. Start studying.</title>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/tasks" aria-label="Maya home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Maya</span>
      </a>
      <nav id="side-links" aria-label="All views"></nav>
      <div id="sidebar-progress" class="sidebar-progress"></div>
    </aside>
    <main id="main">
      <header id="topbar">
        <button id="menu-btn" class="icon-button mobile-menu" type="button" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <label class="quickadd-wrap">
          <span class="sr-only">Quick add a task or exam</span>
          <input id="quickadd-input" autocomplete="off" placeholder="Quick add: Physics test 12 Nov">
        </label>
        <button id="palette-btn" class="icon-button palette-button" type="button" aria-label="Open command palette">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg>
          <span class="palette-shortcut">Ctrl K</span>
        </button>
        <span id="network-status" class="network-status" aria-live="polite"></span>
      </header>
      <div id="view-container" tabindex="-1"></div>
    </main>
    <nav id="bottom-nav" aria-label="Primary views">
      <a data-route="tasks" href="#/tasks"><span class="nav-glyph" aria-hidden="true"></span><span>Tasks</span></a>
      <a data-route="syllabus" href="#/syllabus"><span class="nav-glyph" aria-hidden="true"></span><span>Syllabus</span></a>
      <a data-route="visuals" href="#/visuals"><span class="nav-glyph" aria-hidden="true"></span><span>Visuals</span></a>
      <a data-route="profile" href="#/profile"><span class="nav-glyph" aria-hidden="true"></span><span>Profile</span></a>
    </nav>
    <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <div id="offline-chip" role="status" hidden></div>
    <div id="install-banner" hidden>
      <span>Install Maya for quick access</span>
      <button type="button" data-install>Install</button>
      <button type="button" data-dismiss>Later</button>
    </div>
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
